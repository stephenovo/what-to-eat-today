name: WhatToEatToday

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  indentWidth: 2
  tabWidth: 2
  usesTabs: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WhatToEatToday:
    type: application
    platform: iOS
    sources:
      - path: WhatToEatToday
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenovo.whattoeat.today
        PRODUCT_NAME: WhatToEatToday
        DEVELOPMENT_TEAM: ZBDUUCCJLP
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WhatToEatToday/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "今天吃这个"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WhatToEatTodayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhatToEatTodayTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenovo.whattoeat.today.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WhatToEatToday

schemes:
  WhatToEatToday:
    build:
      targets:
        WhatToEatToday: all
        WhatToEatTodayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: WhatToEatTodayTests
          parallelizable: false
    archive:
      config: Release
